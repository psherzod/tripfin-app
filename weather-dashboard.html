<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .search-box {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box input {
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            width: 300px;
            max-width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transform: scale(1.02);
        }

        .search-box button {
            padding: 12px 30px;
            background: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            color: #667eea;
        }

        .search-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .search-box button:active {
            transform: translateY(0);
        }

        /* Current Weather Section */
        .current-weather {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        .weather-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .location-info h2 {
            font-size: 2em;
            color: #333;
            margin-bottom: 5px;
        }

        .location-info p {
            color: #666;
            font-size: 0.9em;
        }

        .weather-main {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .weather-icon {
            font-size: 4em;
        }

        .temperature-section h3 {
            font-size: 3em;
            color: #667eea;
            margin: 0;
        }

        .weather-description {
            font-size: 1.2em;
            color: #666;
            text-transform: capitalize;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .detail-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .detail-card label {
            display: block;
            font-size: 0.85em;
            color: #666;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .detail-card .value {
            font-size: 1.5em;
            color: #333;
            font-weight: bold;
        }

        /* 5-Day Forecast */
        .forecast-section {
            margin-bottom: 30px;
        }

        .forecast-section h3 {
            color: white;
            font-size: 1.8em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .forecast-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .forecast-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .forecast-card .day {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .forecast-card .icon {
            font-size: 2.5em;
            margin: 10px 0;
        }

        .forecast-card .temp {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 5px;
        }

        .forecast-card .temp-min {
            font-size: 0.9em;
            color: #999;
        }

        .forecast-card .description {
            font-size: 0.85em;
            color: #666;
            margin-top: 10px;
            text-transform: capitalize;
        }

        /* Hourly Forecast */
        .hourly-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        .hourly-section h3 {
            color: #333;
            font-size: 1.5em;
            margin-bottom: 20px;
        }

        .hourly-scroll {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .hourly-card {
            min-width: 120px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            flex-shrink: 0;
        }

        .hourly-card .time {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .hourly-card .icon {
            font-size: 1.8em;
            margin: 8px 0;
        }

        .hourly-card .temp {
            font-size: 1.2em;
            font-weight: bold;
        }

        /* Loading & Error States */
        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            padding: 40px;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: rgba(255, 100, 100, 0.9);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
        }

        .error-close {
            cursor: pointer;
            float: right;
            font-size: 1.5em;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .search-box input {
                width: 100%;
            }

            .weather-main {
                flex-direction: column;
                text-align: center;
            }

            .weather-icon {
                font-size: 3em;
            }

            .temperature-section h3 {
                font-size: 2.5em;
            }

            .forecast-grid {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            }

            .weather-details {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .unit-toggle {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .unit-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border: 2px solid white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .unit-btn.active {
            background: white;
            color: #667eea;
        }

        .unit-btn:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .separator {
            height: 2px;
            background: linear-gradient(90deg, transparent, white, transparent);
            margin: 30px 0;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌤️ Weather Dashboard</h1>
            <p>Real-time weather information at your fingertips</p>
        </div>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name (e.g., New York, London, Tokyo)" autocomplete="off">
            <button onclick="searchCity()">Search</button>
        </div>

        <div class="unit-toggle">
            <button class="unit-btn active" onclick="setUnit('metric')">°C / Km/h</button>
            <button class="unit-btn" onclick="setUnit('imperial')">°F / Mph</button>
        </div>

        <div id="errorContainer"></div>

        <div id="weatherContainer">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading weather data...</p>
            </div>
        </div>
    </div>

    <script>
        // OpenWeatherMap API configuration
        const API_KEY = '85a4e3c55f1d4e3ba3e9b5b1234567890'; // Free tier API key
        const API_BASE = 'https://api.openweathermap.org/data/2.5';
        const GEO_API = 'https://api.openweathermap.org/geo/1.0';

        let currentUnit = 'metric';
        let currentCity = 'New York';
        let weatherData = null;
        let forecastData = null;

        // Weather icon mapping
        const weatherIcons = {
            '01d': '☀️', '01n': '🌙',
            '02d': '🌤️', '02n': '🌤️',
            '03d': '☁️', '03n': '☁️',
            '04d': '☁️', '04n': '☁️',
            '09d': '🌧️', '09n': '🌧️',
            '10d': '🌦️', '10n': '🌧️',
            '11d': '⛈️', '11n': '⛈️',
            '13d': '❄️', '13n': '❄️',
            '50d': '🌫️', '50n': '🌫️'
        };

        // Initialize app with default city
        window.onload = () => {
            fetchWeather(currentCity);
        };

        // Search for city
        function searchCity() {
            const input = document.getElementById('cityInput');
            const city = input.value.trim();
            if (city) {
                currentCity = city;
                fetchWeather(city);
                input.value = '';
            }
        }

        // Allow Enter key to search
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('cityInput');
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchCity();
            });
        });

        // Set temperature unit
        function setUnit(unit) {
            currentUnit = unit;
            document.querySelectorAll('.unit-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            if (weatherData) {
                renderWeather();
            }
        }

        // Fetch weather data
        async function fetchWeather(city) {
            showLoading();
            clearError();

            try {
                // First, geocode the city name
                const geoResponse = await fetch(
                    `${GEO_API}/direct?q=${encodeURIComponent(city)}&limit=1&appid=${API_KEY}`
                );
                const geoData = await geoResponse.json();

                if (!geoData.length) {
                    showError(`City "${city}" not found. Please try another city.`);
                    return;
                }

                const { lat, lon, name, country } = geoData[0];

                // Fetch current weather
                const weatherResponse = await fetch(
                    `${API_BASE}/weather?lat=${lat}&lon=${lon}&units=${currentUnit}&appid=${API_KEY}`
                );
                weatherData = await weatherResponse.json();

                // Fetch 5-day forecast
                const forecastResponse = await fetch(
                    `${API_BASE}/forecast?lat=${lat}&lon=${lon}&units=${currentUnit}&appid=${API_KEY}`
                );
                forecastData = await forecastResponse.json();

                // Update current city info
                currentCity = `${name}, ${country}`;

                renderWeather();
            } catch (error) {
                showError('Failed to fetch weather data. Please try again.');
                console.error('Error:', error);
            }
        }

        // Render weather UI
        function renderWeather() {
            if (!weatherData || !forecastData) return;

            const w = weatherData;
            const tempUnit = currentUnit === 'metric' ? '°C' : '°F';
            const windUnit = currentUnit === 'metric' ? 'km/h' : 'mph';
            const icon = weatherIcons[w.weather[0].icon] || '🌤️';

            const html = `
                <div class="current-weather">
                    <div class="weather-header">
                        <div class="location-info">
                            <h2>${w.name}, ${w.sys.country}</h2>
                            <p>Last updated: ${new Date(w.dt * 1000).toLocaleTimeString()}</p>
                        </div>
                    </div>

                    <div class="weather-main">
                        <div class="weather-icon">${icon}</div>
                        <div class="temperature-section">
                            <h3>${Math.round(w.main.temp)}${tempUnit}</h3>
                            <div class="weather-description">${w.weather[0].description}</div>
                        </div>
                    </div>

                    <div class="weather-details">
                        <div class="detail-card">
                            <label>Feels Like</label>
                            <div class="value">${Math.round(w.main.feels_like)}${tempUnit}</div>
                        </div>
                        <div class="detail-card">
                            <label>Humidity</label>
                            <div class="value">${w.main.humidity}%</div>
                        </div>
                        <div class="detail-card">
                            <label>Wind Speed</label>
                            <div class="value">${Math.round(w.wind.speed)} ${windUnit}</div>
                        </div>
                        <div class="detail-card">
                            <label>Pressure</label>
                            <div class="value">${w.main.pressure} mb</div>
                        </div>
                        <div class="detail-card">
                            <label>Visibility</label>
                            <div class="value">${(w.visibility / 1000).toFixed(1)} km</div>
                        </div>
                        <div class="detail-card">
                            <label>UV Index</label>
                            <div class="value">N/A</div>
                        </div>
                    </div>
                </div>

                <div class="forecast-section">
                    <h3>5-Day Forecast</h3>
                    <div class="forecast-grid">
                        ${get5DayForecast()}
                    </div>
                </div>

                <div class="separator"></div>

                <div class="hourly-section">
                    <h3>Hourly Forecast (Next 24 Hours)</h3>
                    <div class="hourly-scroll">
                        ${getHourlyForecast()}
                    </div>
                </div>
            `;

            document.getElementById('weatherContainer').innerHTML = html;
        }

        // Get 5-day forecast (one per day at noon)
        function get5DayForecast() {
            const forecasts = {};
            const tempUnit = currentUnit === 'metric' ? '°C' : '°F';

            forecastData.list.forEach(item => {
                const date = new Date(item.dt * 1000);
                const day = date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                
                if (!forecasts[day]) {
                    forecasts[day] = item;
                }
            });

            return Object.entries(forecasts).slice(0, 5).map(([day, data]) => {
                const icon = weatherIcons[data.weather[0].icon] || '🌤️';
                return `
                    <div class="forecast-card">
                        <div class="day">${day}</div>
                        <div class="icon">${icon}</div>
                        <div class="temp">${Math.round(data.main.temp)}${tempUnit}</div>
                        <div class="temp-min">${Math.round(data.main.temp_min)}${tempUnit}</div>
                        <div class="description">${data.weather[0].description}</div>
                    </div>
                `;
            }).join('');
        }

        // Get hourly forecast (next 24 hours)
        function getHourlyForecast() {
            const tempUnit = currentUnit === 'metric' ? '°C' : '°F';
            
            return forecastData.list.slice(0, 8).map(item => {
                const time = new Date(item.dt * 1000).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                const icon = weatherIcons[item.weather[0].icon] || '🌤️';
                return `
                    <div class="hourly-card">
                        <div class="time">${time}</div>
                        <div class="icon">${icon}</div>
                        <div class="temp">${Math.round(item.main.temp)}${tempUnit}</div>
                    </div>
                `;
            }).join('');
        }

        // Show loading state
        function showLoading() {
            document.getElementById('weatherContainer').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading weather data...</p>
                </div>
            `;
        }

        // Show error message
        function showError(message) {
            const errorContainer = document.getElementById('errorContainer');
            errorContainer.innerHTML = `
                <div class="error">
                    <span class="error-close" onclick="clearError()">✕</span>
                    <strong>⚠️ Error:</strong> ${message}
                </div>
            `;
            document.getElementById('weatherContainer').innerHTML = '';
        }

        // Clear error message
        function clearError() {
            document.getElementById('errorContainer').innerHTML = '';
        }
    </script>
</body>
</html>
